<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; font-family: 'Segoe UI', sans-serif; }
    #stage { width: 220px; min-height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    #bubble { display: none; max-width: 150px; margin-bottom: 2px; padding: 2px 8px; border-radius: 10px; background: #1a1a2e; color: #fff; font-size: 11px; line-height: 1.35; box-shadow: 0 2px 8px rgba(0,0,0,.4); border: 1px solid transparent; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #bubble.done { border-color: #30a46c; }
    #bubble.ask { border-color: #e5484d; }
    #bubble.show { display: block; }
    #pet-wrap { position: relative; width: 88px; height: 63px; cursor: grab; }
    #pet-wrap.dragging { cursor: grabbing; }
    #capybara { width: 88px; height: 63px; image-rendering: pixelated; pointer-events: none; }
    #badge { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
    #badge.wait { display: flex; background: #e5484d; }
    #badge.run { display: flex; background: #f5a524; animation: pulse 1.2s ease-in-out infinite; }
    #badge.done { display: flex; background: #30a46c; }
    #badge.review { display: flex; background: #3e63dd; }
    #badge.review .count { border-color: #3e63dd; }
    @keyframes pulse { 50% { transform: scale(1.2); } }
    #badge svg { width: 14px; height: 14px; }
    #badge .count { position: absolute; top: -7px; right: -7px; min-width: 14px; height: 14px; padding: 0 3px; box-sizing: border-box; border-radius: 7px; background: #1a1a2e; border: 1px solid #f5a524; color: #fff; font-size: 10px; font-weight: 700; line-height: 12px; text-align: center; }
    #progress { display: none; box-sizing: border-box; max-width: 212px; margin-bottom: 2px; padding: 4px 9px; border-radius: 10px; background: rgba(26,26,46,.92); color: #fff; font-size: 11px; line-height: 1.3; box-shadow: 0 2px 8px rgba(0,0,0,.4); border: 1px solid #f5a524; word-break: break-all; pointer-events: none; }
    #progress.show { display: block; }
    #progress .who { opacity: .6; }
    #progress > div + div { margin-top: 2px; }
    #progress.compact { display: none; align-items: center; gap: 4px; max-width: 120px; margin-bottom: 12px; padding: 1px 6px; font-size: 10px; line-height: 1.3; white-space: nowrap; }
    #progress.compact.show { display: flex; }
    #progress.compact .text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #progress.compact .n { flex: none; }
    #prompt { display: none; box-sizing: border-box; width: 212px; margin-bottom: 6px; padding: 8px; border-radius: 10px; background: #1a1a2e; border: 1px solid #6c63ff; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    #prompt.show { display: block; }
    #prompt textarea { display: block; box-sizing: border-box; width: 100%; height: 64px; resize: none; border: 0; border-radius: 6px; padding: 6px; background: rgba(255,255,255,.08); color: #fff; font: 12px/1.35 'Segoe UI', sans-serif; outline: none; user-select: text; }
    #prompt .hint { margin-top: 4px; color: #fff; opacity: .5; font-size: 10px; }
    #prompt .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
    .tabs button { border: 0; border-radius: 5px; padding: 2px 9px; background: transparent; color: #fff; opacity: .55; font-size: 11px; font-weight: 600; cursor: pointer; }
    #prompt-close { margin-left: auto; opacity: .7; font-size: 14px; line-height: 1; padding: 1px 7px; }
    .tabs button.on { background: #6c63ff; opacity: 1; }
    .chips { display: none; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .chips button { border: 1px solid #44445f; border-radius: 9px; padding: 0 7px; background: transparent; color: #fff; font-size: 10px; line-height: 16px; cursor: pointer; }
    .chips button.on { border-color: #6c63ff; background: rgba(108,99,255,.35); }
    #prompt[data-mode="rewrite"] .chips { display: flex; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="bubble"></div>
    <div id="progress"></div>
    <div id="prompt" data-mode="send">
      <div class="tabs">
        <button data-mode="send">Send</button>
        <button data-mode="rewrite">Rewrite</button>
        <button id="prompt-close" title="Close (Esc)">×</button>
      </div>
      <textarea id="prompt-input" placeholder="Message to Claude" spellcheck="false"></textarea>
      <div class="chips" id="prompt-chips"></div>
      <div class="hint" id="prompt-hint"></div>
    </div>
    <div id="pet-wrap">
      <canvas id="capybara" width="42" height="30"></canvas>
      <div id="badge"></div>
    </div>
  </div>
  <script src="pets.js"></script>
  <script src="pet.js"></script>
</body>
</html>
